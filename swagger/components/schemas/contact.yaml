type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType 
  - userId
properties:
  _id:
    description: "Contact's Id"
    type: string
    example: 67333b7e721cbb7aed8baba5
  name: 
    description: "Contact's name"
    type: string
    example: "John Doe"
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '0630001122'
  email:
    description: "Contact's email"
    type: string
    example: "example1@gmail.com"
  isFavourite:
    description: "Indicates whether the item is marked as a favorite by the user."
    type: boolean
    example: true
    default: false
  contactType:
    description: "Specifies the type of contact for the individual or organization."
    type: string 
    enum: ['work', 'home', 'personal']
    default: 'personal'
  photo:
    description: "Contact's photo"
    type: string
    example: "https://res.cloudinary.com/uqwgdu/image/upload/image.png"
  userId:
    description: "Contact's user Id"
    type: string 
    example: 67333b7e721cbb7aed8baba5
    default: null  
