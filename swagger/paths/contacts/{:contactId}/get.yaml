tags:
- Contacts
summary: Get contact by id
operationId: getContact
description: 'Get contact by Id'
security:
- bearerAuth: []
parameters:
- in: path
  name: id
  required: true
  schema:
    type: string
    example: 67333b7e721cbb7aed8baba5
responses:
  '200':
    description: 'Get user by id'
    content:
      application/json:
        schema:
          type: object
          required:
          - status
          - message
          - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contact with id 67333b7e721cbb7aed8baba5'
            data:
              $ref: ../../../components/schemas/contact.yaml
  '404':
    description: 'Contact not found'
    content:
      application/json:
        schema:
          type: object
          required:
          - status
          - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact not found'
            data:
              type: object
              example: {}
