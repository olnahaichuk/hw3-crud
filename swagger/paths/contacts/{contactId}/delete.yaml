tags:
- Contacts
summary: Delete contact by id
operationId: deleteContact
description: 'Delete contact by Id'
security:
- bearerAuth: []
parameters:
- in: path
  name: contactId
  required: true
  schema:
    type: string
    example: 67333b7e721cbb7aed8baba5
responses:
  '204':
    description: 'Succesfully deleted contact'
  '404':
    description: 'Contact not found'
    content:
      application/json:
        schema:
          type: object
          required:
          - status
          - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact not found'
            data:
              type: object
              example: {}
