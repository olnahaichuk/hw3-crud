tags:
- Contacts
summary: Update contact by id
operationId: updateContact
description: 'Update contact by Id'
security:
- bearerAuth: []
parameters:
- in: path
  name: contactId
  required: true
  schema:
    type: string
    example: 67333b7e721cbb7aed8baba5
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: "John Doe"
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '0630001122'
          email:
            description: "Contact's email"
            type: string
            example: "example1@gmail.com"
          isFavourite:
            description: "Indicates whether the item is marked as a favorite by the user."
            type: boolean
            example: true
          contactType:
            description: "Specifies the type of contact for the individual or organization."
            type: string
            enum: [ 'work', 'home', 'personal' ]
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: 'Update contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
          - status
          - message
          - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patched a contact'
            data:
              $ref: ../../../components/schemas/contact.yaml
  '404':
    description: 'Contact not found'
    content:
      application/json:
        schema:
          type: object
          required:
          - status
          - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact not found'
            data:
              type: object
              example: {}
